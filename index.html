<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3b5bdb">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>نظام الموارد البشرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>
/* تطبيق المظهر المحفوظ قبل الرسم لتفادي الوميض */
(function(){try{var t=localStorage.getItem('hr-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}})();
</script>
<style>
:root{
  --bg:#f3f5fa;--surface:#fff;--surface2:#f6f7fb;--ink:#141b2d;--mut:#667085;--line:#e4e8f0;
  --pri:#3b5bdb;--pri2:#6741d9;--pri-soft:#e8edff;--on-pri:#fff;--ring:rgba(59,91,219,.18);
  --ok:#12805c;--ok-soft:#dcf5ea;--bad:#c92a2a;--bad-soft:#ffe3e3;--warn:#b45f06;--warn-soft:#fff0d6;
  --glass:rgba(255,255,255,.82);--glow:rgba(103,65,217,.08);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -8px rgba(16,24,40,.08);
  --r:14px;--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light
}
[data-theme=dark]{
  --bg:#0d1220;--surface:#151c2e;--surface2:#1b2438;--ink:#e8ecf6;--mut:#93a0b8;--line:#27324b;
  --pri:#7b97ff;--pri2:#9a80ff;--pri-soft:#202b52;--on-pri:#0b1226;--ring:rgba(123,151,255,.28);
  --ok:#4cd9a0;--ok-soft:#113a2c;--bad:#ff8585;--bad-soft:#44191e;--warn:#ffb457;--warn-soft:#3d2c10;
  --glass:rgba(21,28,46,.82);--glow:rgba(123,151,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -8px rgba(0,0,0,.45);color-scheme:dark
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;
  background-image:radial-gradient(900px 420px at 100% -10%,var(--glow),transparent 70%)}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-weight:800}
a{color:var(--pri)}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--mut);font-size:13px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* ---------- أزرار ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on-pri);border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font:inherit;font-weight:700;position:relative;transition:transform .15s var(--ease),box-shadow .2s,filter .2s,opacity .2s,background .2s;box-shadow:0 6px 16px -6px rgba(59,91,219,.55);text-decoration:none}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn.sec{background:var(--surface2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--mut);box-shadow:none}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.icon{padding:8px;border-radius:10px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.sm.icon{padding:6px}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading .ic{opacity:0}
.btn.loading::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--on-pri);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn.sec.loading::after,.btn.ghost.loading::after,.btn.danger.loading::after{border-color:var(--ink);border-top-color:transparent}

/* ---------- حقول ---------- */
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--ring)}
input[type=checkbox],input[type=radio]{width:auto}
input[type=file]{padding:7px}
textarea{min-height:84px;resize:vertical}
.fld>label{display:block;font-size:13px;color:var(--mut);margin-bottom:5px;font-weight:500}
.fld+.fld{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid .full{grid-column:1/-1}
.grid+.fld{margin-top:14px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:16px 0 0;cursor:pointer}
.consent input{margin-top:5px}
.prev{display:block;max-height:90px;margin-top:8px;border-radius:10px;border:1px solid var(--line)}
.pwrap{position:relative}
.pwrap .btn{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%)}
.pwrap input{padding-inline-end:46px}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}

/* عناوين أقسام النموذج */
.fsec{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:14px;font-weight:800;color:var(--pri)}
.fsec:first-child{margin-top:0}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}

/* أزرار اختيار اللجنة */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px}
.opts label{margin:0;cursor:pointer;position:relative;display:block}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;color:var(--ink);transition:all .2s var(--ease);height:100%}
.opts span::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;transition:all .2s}
.opts label:hover span{transform:translateY(-1px);border-color:var(--pri)}
.opts input:checked+span{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:700;box-shadow:0 0 0 3px var(--ring)}
.opts input:checked+span::before{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 45%,transparent 50%)}
.opts input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}

/* ---------- بطاقات وحركات ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 14px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rise{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes float{50%{transform:translate(30px,40px) scale(1.08)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fillw{from{transform:scaleX(0)}}
@keyframes tin{from{opacity:0;transform:translateY(20px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(10px) scale(.95)}}
@keyframes pulse{50%{box-shadow:0 0 0 12px transparent}}
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:8px}

/* ---------- دخول ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 14s ease-in-out infinite}
.blob.a{width:440px;height:440px;background:var(--pri);top:-140px;inset-inline-end:-120px}
.blob.b{width:380px;height:380px;background:var(--pri2);bottom:-140px;inset-inline-start:-100px;animation-delay:-6s}
.auth-card{position:relative;width:min(400px,100%);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:30px 26px;box-shadow:0 30px 70px -25px rgba(20,27,45,.4);animation:rise .7s var(--ease) both}
.auth-card.shake{animation:shake .4s}
.auth-card h1{margin:14px 0 2px;font-size:22px;text-align:center}
.auth-card .muted{text-align:center;margin:0 0 20px}
.auth-card .btn{margin-top:18px}
.logo{width:58px;height:58px;border-radius:18px;margin:0 auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on-pri);animation:pulse 2.6s infinite;box-shadow:0 10px 24px -8px rgba(59,91,219,.6)}
.c{text-align:center}

/* ---------- الهيكل ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand .logo{width:38px;height:38px;border-radius:12px;margin:0;animation:none}
.brand b{font-size:15.5px}
#nav{display:flex;flex-direction:column;gap:4px}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:500;position:relative;transition:background .2s,color .2s,transform .2s var(--ease)}
.nav-i:hover{background:var(--surface2);color:var(--ink);transform:translateX(-3px)}
.nav-i.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.nav-i.on::before{content:"";position:absolute;inset-inline-start:-14px;top:22%;bottom:22%;width:4px;border-radius:4px;background:var(--pri);animation:grow .4s var(--ease)}
.side-foot{margin-top:auto;text-align:center}
.content{min-width:0}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 26px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:19px}
.top-r{display:flex;align-items:center;gap:6px}
.user{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--line);border-radius:99px;padding:4px;padding-inline-end:14px;cursor:pointer;font:inherit;color:var(--ink);transition:background .2s}
.user:hover{background:var(--surface2)}
.user .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
main.view{padding:22px 26px 48px;max-width:1280px;margin:0 auto}

/* ---------- أدوات الشريط ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar.tight{margin-bottom:10px}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{padding-inline-start:38px}
.chips{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:12px}
.chips button{border:0;background:transparent;color:var(--mut);padding:6px 13px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;transition:all .2s}
.chips button:hover{color:var(--ink)}
.chips button.on{background:var(--pri-soft);color:var(--pri);font-weight:700}
.chips small{opacity:.75;margin-inline-start:3px}
.toolbar .end{margin-inline-start:auto}
.toolbar .end~.btn{margin-inline-start:0}
/* فلاتر المحافظة والصفة واللجنة */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select{width:auto;min-width:165px;max-width:260px;flex:1 1 165px}
.filters select.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:700}

/* ---------- تحليل الأعضاء في الداشبورد ---------- */
.dsec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.dsec:not(:first-child){margin-top:30px}
.dsec h2{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.hb{display:grid;gap:11px}
.hb-r{display:grid;grid-template-columns:minmax(110px,36%) 1fr 70px;align-items:center;gap:10px;font-size:14px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:var(--surface2);border-radius:9px;overflow:hidden}
.hb-t i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px;transform-origin:right;animation:fillw 1s var(--ease) both}
.hb-t i.ok{background:linear-gradient(90deg,var(--ok),#34d399)}
.hb-t i.warn{background:linear-gradient(90deg,var(--warn),#fbbf24)}
.hb-t i.bad{background:linear-gradient(90deg,var(--bad),#fb7185)}
.hb-v{text-align:end;font-weight:800;white-space:nowrap}
.hb-v small{font-weight:400;font-size:11.5px}
.sc{max-height:380px;overflow:auto;padding-inline-end:4px}
.card h2 .muted{font-weight:400}
tfoot th{border-top:2px solid var(--line);border-bottom:0;color:var(--ink);font-size:13.5px}
@media (max-width:640px){.hb-r{grid-template-columns:minmax(90px,38%) 1fr 62px}}

/* ---------- جداول ---------- */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:12.5px;white-space:nowrap;background:var(--surface2)}
th:first-child{border-start-start-radius:10px}th:last-child{border-start-end-radius:10px}
tbody tr{transition:background .15s;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*35ms)}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px;min-width:190px}
button.who{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:start;cursor:pointer}
button.who:hover b{color:var(--pri)}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on-pri);display:grid;place-items:center;font-weight:800;font-size:14px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;animation:fade .4s}
.row-actions{display:flex;gap:4px;flex-wrap:nowrap;justify-content:flex-end}
.more{text-align:center;padding-top:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.info{background:var(--pri-soft);color:var(--pri)}
.tag.mut{background:var(--surface2);color:var(--mut)}
.empty{text-align:center;padding:38px 12px;color:var(--mut)}
.empty .ic{opacity:.45;margin-bottom:8px}
.empty p{margin:0 0 12px}

/* ---------- نافذة بيانات العضو ---------- */
.d-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.d-head .av{width:58px;height:58px;font-size:20px}
.d-head h4{margin:0 0 4px;font-size:18px}
.d-head .tags{display:flex;gap:6px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0}
.kv>div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.kv dt{font-size:12px;color:var(--mut);margin-bottom:1px}
.kv dd{margin:0;font-weight:700;word-break:break-word}
.kv .full{grid-column:1/-1}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:16px}
.pcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface2)}
.pc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-weight:700;font-size:14px;border-bottom:1px solid var(--line);background:var(--surface)}
.pc-act{display:flex;gap:6px}
.pbox{min-height:190px;display:grid;place-items:center;padding:12px;color:var(--mut);font-size:13px;text-align:center}
.pbox img{max-width:100%;max-height:320px;border-radius:10px;animation:fade .4s}

/* ---------- لوحة التحكم ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:13px;align-items:center;box-shadow:var(--shadow);transition:transform .25s var(--ease),box-shadow .25s}
.kpi:hover{transform:translateY(-3px)}
.k-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);flex:none}
.kpi.ok .k-ic{background:var(--ok-soft);color:var(--ok)}
.kpi.bad .k-ic{background:var(--bad-soft);color:var(--bad)}
.kpi.warn .k-ic{background:var(--warn-soft);color:var(--warn)}
.kpi b{display:block;font-size:26px;line-height:1.2;font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.cols>.card{margin-bottom:0}
.cols+.card,.cols+.cols,.card+.cols{margin-top:16px}
.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:164px;height:164px}
.seg{transition:stroke-dasharray 1.1s var(--ease);fill:none;stroke-width:16}
.d-n{font-size:26px;font-weight:800;fill:var(--ink)}
.d-l{font-size:11px;fill:var(--mut)}
.leg{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.leg li{display:flex;align-items:center;gap:8px}
.leg i{width:11px;height:11px;border-radius:4px;flex:none}
.leg b{margin-inline-start:auto;padding-inline-start:14px}
.wchart{display:flex;gap:14px;align-items:flex-end;justify-content:space-around;padding-top:24px;overflow-x:auto}
.wg{display:flex;flex-direction:column;align-items:center;gap:6px}
.bars{height:150px;display:flex;align-items:flex-end;gap:4px}
.bar{position:relative;width:20px;height:var(--h);border-radius:7px 7px 3px 3px;transform-origin:bottom;animation:grow .9s var(--ease) both;animation-delay:var(--d,0ms)}
.bar.b1{background:linear-gradient(var(--pri2),var(--pri))}
.bar.b2{background:linear-gradient(#fbbf24,#f59e0b)}
.bar em{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--mut)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:12px;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.legend i.b1{background:var(--pri)}.legend i.b2{background:#f59e0b}
.prog{height:8px;background:var(--surface2);border-radius:9px;overflow:hidden;min-width:70px;flex:1}
.prog i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--ok),#34d399);border-radius:9px;transform-origin:right;animation:fillw 1.1s var(--ease) both}
.prog i.warn{background:linear-gradient(90deg,var(--warn),#fbbf24)}
.prog i.bad{background:linear-gradient(90deg,var(--bad),#fb7185)}
.pr{display:flex;align-items:center;gap:8px;min-width:120px}
.list-i{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-i:last-child{border-bottom:0}
.stars{color:#f59e0b;letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}

/* ---------- المهام ---------- */
.tasks{display:grid;gap:12px}
.task{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border-inline-start:4px solid var(--mut);transition:transform .25s var(--ease)}
.task:hover{transform:translateY(-2px)}
.task.ok{border-inline-start-color:var(--ok)}
.task.bad{border-inline-start-color:var(--bad)}
.task.warn{border-inline-start-color:var(--warn)}

.m-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

function friendly(e){
  const m = (e && e.message) || String(e);
  if (/duplicate key/i.test(m)) return 'القيمة مستخدمة مسبقاً (رقم العضوية أو رقم البطاقة)';
  if (/row-level security|permission denied|not authorized/i.test(m)) return 'ليست لديك صلاحية لهذه العملية';
  if (/failed to fetch|network|load failed/i.test(m)) return 'تعذر الاتصال، تحقق من الإنترنت';
  if (/check constraint/i.test(m)) return 'قيمة غير صالحة، راجع الحقول';
  if (/jwt|expired/i.test(m)) return 'انتهت الجلسة، سجّل الدخول من جديد';

function openModal(title, html, o = {}){
  const prev = document.activeElement;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal${o.wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="m-head"><h3>${esc(title)}</h3><button type="button" class="btn ghost icon" data-close aria-label="إغلاق">${ic('x')}</button></div>
    <div class="m-body">${html}</div></div>`;
  document.body.appendChild(ov);
  document.body.classList.add('noscroll');
  let closed = false;
  const key = e => { if (e.key === 'Escape') close(); };
  function close(){
    if (closed) return; closed = true;
    document.removeEventListener('keydown', key);
    ov.classList.add('out');
    if (!$('.overlay:not(.out)')) document.body.classList.remove('noscroll');
    setTimeout(() => ov.remove(), 200);
    if (prev && prev.focus) try { prev.focus(); } catch (e) {}
    if (o.onClose) o.onClose();
  }
  document.addEventListener('keydown', key);
  ov.addEventListener('mousedown', e => { if (e.target === ov || e.target.closest('[data-close]')) close(); });
  setTimeout(() => { const f = $('input:not([type=file]):not([type=hidden]):not([type=radio]),select,textarea', ov); if (f) f.focus(); }, 80);
  const api = { el: ov, close };
  if (o.onMount) o.onMount(ov, close);
  return api;
}

    const to = parseFloat(el.dataset.count), dec = +el.dataset.dec || 0, suf = el.dataset.suf || '';
    if (isNaN(to)) return;
    if (reduce){ el.textContent = to.toFixed(dec) + suf; return; }
    const t0 = performance.now(), dur = 900;
    const tick = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = (to * e).toFixed(dec) + suf; if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

}

/* ---------- الصور ---------- */
function compress(file, max = 1280, q = 0.82){
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error('الملف المختار ليس صورة'));
    if (file.size > 25 * 1024 * 1024) return rej(new Error('الصورة كبيرة جداً'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('فشل ضغط الصورة')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ملف الصورة غير صالح')); };
    img.src = url;
  });
}
async function uploadImage(bucket, file){
  const blob = await compress(file);
  const path = `${me.id}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return path;
}
function saveBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* تنزيل صورة إلى جهاز المسؤول. تنزيل الهوية يُسجَّل في سجل الوصول أولاً. */
async function downloadImage(bucket, path, emp, btn){

    const { data, error } = await sb.storage.from(bucket).download(path);
    if (error) throw error;
    const ext = (path.split('.').pop() || 'jpg').toLowerCase();
    saveBlob(data, `${fname(emp.full_name)} - ${bucket === 'ids' ? 'صورة الهوية' : 'الصورة الشخصية'}.${ext}`);

}

/* ألوان متوافقة مع ألوان الموقع */
const XC = { title: 'FF2B3F9E', head: 'FF3B5BDB', sub: 'FFE8EDFF', zebra: 'FFF6F7FB', line: 'FFE4E8F0', ink: 'FF141B2D' };
const XT = { ok: ['FFDCF5EA', 'FF12805C'], bad: ['FFFFE3E3', 'FFC92A2A'], warn: ['FFFFF0D6', 'FFB45F06'], info: ['FFE8EDFF', 'FF3B5BDB'], mut: ['FFF1F3F8', 'FF667085'] };
const xSolid = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
const xFont = (o = {}) => ({ name: 'Arial', size: 10, color: { argb: XC.ink }, ...o });
const xLine = { style: 'thin', color: { argb: XC.line } };
const xBorder = { top: xLine, left: xLine, bottom: xLine, right: xLine };
const xBlank = v => (v === null || v === undefined || String(v).trim() === '') ? '—' : String(v);

function buildSheet(wb, sh){
  const n = sh.cols.length;
  const ws = wb.addWorksheet(sh.name, {
    views: [{ rightToLeft: true, state: 'frozen', ySplit: 4, showGridLines: false }],
    properties: { tabColor: { argb: XC.head } },
    pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, horizontalCentered: true, printTitlesRow: '4:4', margins: { left: 0.4, right: 0.4, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 } },
    headerFooter: { oddFooter: '&Cصفحة &P من &N' }
  });
  sh.cols.forEach((c, j) => { ws.getColumn(j + 1).width = c.w; });

  // السطر 1: العنوان — السطر 2: بيانات التصدير — السطر 3: فاصل
  for (let j = 1; j <= n; j++){ ws.getCell(1, j).fill = xSolid(XC.title); ws.getCell(2, j).fill = xSolid(XC.sub); }
  const t = ws.getCell(1, 1);
  t.value = sh.title; t.font = xFont({ size: 16, bold: true, color: { argb: 'FFFFFFFF' } });
  t.alignment = { vertical: 'middle', horizontal: 'right', indent: 1, readingOrder: 'rtl' };
  const s = ws.getCell(2, 1);
  s.value = `تاريخ التصدير: ${fmtDT(new Date())}   ·   عدد السجلات: ${sh.rows.length}${sh.note ? '   ·   ' + sh.note : ''}`;
  s.font = xFont({ size: 10, color: { argb: XC.title } });
  s.alignment = { vertical: 'middle', horizontal: 'right', indent: 1, readingOrder: 'rtl' };
  if (n > 1){ ws.mergeCells(1, 1, 1, n); ws.mergeCells(2, 1, 2, n); }
  ws.getRow(1).height = 38; ws.getRow(2).height = 22; ws.getRow(3).height = 6;

  // السطر 4: رؤوس الأعمدة
  const hr = ws.getRow(4); hr.height = 30;
  sh.cols.forEach((c, j) => {
    const cell = hr.getCell(j + 1);
    cell.value = c.h;
    cell.font = xFont({ bold: true, size: 10.5, color: { argb: 'FFFFFFFF' } });
    cell.fill = xSolid(XC.head);
    cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true, readingOrder: 'rtl' };
    cell.border = { top: xLine, left: { style: 'thin', color: { argb: 'FF5C78E6' } }, bottom: xLine, right: { style: 'thin', color: { argb: 'FF5C78E6' } } };
  });

  // الصفوف
  sh.rows.forEach((row, i) => {
    const xr = ws.getRow(5 + i);
    let lines = 1;
    sh.cols.forEach((c, j) => {
      const raw = c.v(row, i);
      let val = raw, nf = null, hz = 'center';
      switch (c.t){
        case 'text':   val = xBlank(raw); hz = 'right'; nf = '@'; break;
        case 'code':   val = xBlank(raw); nf = '@'; break;
        case 'num':    val = (raw === null || raw === undefined || raw === '') ? '—' : Number(raw); nf = '0'; break;
        case 'num1':   val = (raw === null || raw === undefined || raw === '') ? '—' : Number(raw); nf = '0.0'; break;
        case 'date': { const d = raw ? ymd(raw) : ''; val = isDate(d) ? new Date(d + 'T00:00:00Z') : '—'; nf = 'yyyy-mm-dd'; break; }
        case 'dt':   { const d = raw ? new Date(raw) : null; val = (d && !isNaN(d)) ? new Date(d.getTime() - d.getTimezoneOffset() * 60000) : '—'; nf = 'yyyy-mm-dd hh:mm'; break; }
        default:       val = xBlank(raw);
      }
      const cell = xr.getCell(j + 1);
      cell.value = val;
      if (nf) cell.numFmt = nf;
      cell.font = xFont();
      cell.fill = xSolid(i % 2 ? XC.zebra : 'FFFFFFFF');
      cell.border = xBorder;
      cell.alignment = { vertical: 'middle', horizontal: hz, wrapText: c.t === 'text', readingOrder: 'rtl' };
      if (c.t === 'status'){
        const [bg, fg] = XT[(c.tone && c.tone(val, row)) || 'mut'] || XT.mut;
        cell.fill = xSolid(bg); cell.font = xFont({ bold: true, color: { argb: fg } });
      }
      if (c.t === 'text') lines = Math.max(lines, Math.ceil(String(val).length / Math.max(6, c.w * 1.05)));
    });
    xr.height = Math.max(24, lines * 15 + 8);
  });

  ws.autoFilter = { from: { row: 4, column: 1 }, to: { row: 4, column: n } };
}
async function exportXlsx(file, sheets, btn){
  sheets = sheets.filter(s => s.rows.length);
  if (!sheets.length) return toast('لا توجد بيانات للتصدير', true);
  await run(btn, async () => {
    await loadExcelJS();
    const wb = new ExcelJS.Workbook();
    wb.creator = 'نظام الموارد البشرية'; wb.created = new Date();
    sheets.forEach(sh => buildSheet(wb, sh));
    const buf = await wb.xlsx.writeBuffer();
    saveBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), file);
    toast('تم تنزيل ' + file);
  });
}

let thumbs = { at: 0, map: {} };
async function hydrateThumbs(){
  const els = $$('.av[data-path]').filter(e => e.dataset.path);
  if (!els.length) return;
  if (Date.now() - thumbs.at > 240000) thumbs = { at: Date.now(), map: {} };
  const need = [...new Set(els.map(e => e.dataset.path))].filter(p => !thumbs.map[p]);
  if (need.length){
    try {
      const { data } = await sb.storage.from('photos').createSignedUrls(need, 300);
      (data || []).forEach(d => { if (d.signedUrl && d.path) thumbs.map[d.path] = d.signedUrl; });
    } catch (e) {}
  }
  els.forEach(el => {
    const u = thumbs.map[el.dataset.path]; if (!u || el.querySelector('img')) return;
    const img = new Image(); img.alt = ''; img.loading = 'lazy';
    img.onload = () => { el.textContent = ''; el.appendChild(img); };
    img.src = u;
  });
}

let empCache = [], empF = newF();
const incomplete = r => !r.membership_no || !r.governorate || !r.national_id || !r.capacity || !r.committee || !r.phone || !r.address || !r.birth_date
  || !r.gender || !r.union_governorate || !r.study_status || !r.edu_stage || !r.institution;

/* skipSt = true: تجاهل فلتر الحالة (لحساب عدّادات أزرار الكل/نشط/غير نشط) */
function filteredEmps(skipSt){
  const toks = norm(empF.q).split(' ').filter(Boolean);
  return empCache.filter(r => {
    if (!skipSt && empF.st !== 'all' && r.status !== empF.st) return false;
    for (const x of FILTERS) if (empF[x.k] && r[x.f] !== empF[x.k]) return false;
    if (!toks.length) return true;
    const hay = norm([r.full_name, r.membership_no, r.phone, r.national_id].join(' '));
    return toks.every(t => hay.includes(t));
  });
}
const anyFilter = () => !!(empF.q.trim() || empF.st !== 'all' || FILTERS.some(x => empF[x.k]));
function filterNote(){
  const p = [];
  if (empF.st !== 'all') p.push('الحالة: ' + (empF.st === 'active' ? 'نشط' : 'غير نشط'));
  FILTERS.forEach(x => { if (empF[x.k]) p.push(x.note + ': ' + empF[x.k]); });
  if (empF.q.trim()) p.push('بحث: ' + empF.q.trim());
  return p.join('   ·   ');
}

  $('#stc').onclick = e => { const b = e.target.closest('button'); if (!b) return; empF.st = b.dataset.v; empF.limit = 60; $$('#stc button').forEach(x => x.classList.toggle('on', x === b)); renderEmployees(); };
  $('#flt').addEventListener('change', e => {

  $('#fReset').onclick = () => {

}
async function loadEmployees(){
  empCache = await db(sb.from('employees').select('*').order('created_at', { ascending: false }));
  renderEmployees();
}
function renderEmployees(){
  const list = $('#list'); if (!list) return;
  const rows = filteredEmps();

  const cnts = { all: base.length, active: base.filter(r => r.status === 'active').length, inactive: base.filter(r => r.status === 'inactive').length };
  $$('#stc button').forEach(b => { const s = $('small', b); if (s) s.textContent = cnts[b.dataset.v]; });
  $$('#flt select').forEach(s => s.classList.toggle('on', !!s.value));
  const rs = $('#fReset'); if (rs) rs.hidden = !anyFilter();
  const c = $('#cnt'); if (c) c.textContent = rows.length + ' من ' + empCache.length;
  if (!rows.length){ list.innerHTML = emptyBox('users', empCache.length ? 'لا توجد نتائج مطابقة.' : 'لم تُسجَّل أي بيانات بعد. اضغط «إضافة عضو» للبدء.'); return; }
  const shown = rows.slice(0, empF.limit);

    <td><button type="button" class="who" data-a="view" data-id="${r.id}" title="عرض بيانات العضو"><span class="av" data-path="${esc(r.photo_path || '')}">${esc(initials(r.full_name))}</span><div><b>${esc(r.full_name)}</b><div class="muted">${r.membership_no ? 'رقم العضوية: <bdi>' + esc(r.membership_no) + '</bdi>' : '—'}${incomplete(r) ? ' <span class="tag warn">بيانات ناقصة</span>' : ''}</div></div></button></td>
    <td>${r.capacity ? `<span class="tag info">${esc(r.capacity)}</span>` : '—'}</td>
    <td>${esc(r.committee) || '—'}</td><td>${esc(r.governorate) || '—'}</td><td><bdi>${esc(r.phone) || '—'}</bdi></td>
    <td><span class="tag ${r.status === 'active' ? 'ok' : 'mut'}">${r.status === 'active' ? 'نشط' : 'غير نشط'}</span></td>
    ${isAdmin() ? `<td>${esc(nameOf(r.created_by))}</td>` : ''}
    <td><div class="row-actions">
      <button class="btn ghost sm icon" data-a="view" data-id="${r.id}" title="عرض التفاصيل والصور" aria-label="عرض التفاصيل والصور">${ic('eye')}</button>
      <button class="btn ghost sm icon" data-a="edit" data-id="${r.id}" title="تعديل" aria-label="تعديل">${ic('edit')}</button>
      ${isAdmin() ? `<button class="btn danger sm icon" data-a="del" data-id="${r.id}" title="حذف" aria-label="حذف">${ic('trash')}</button>` : ''}
    </div></td></tr>`).join('')}</tbody></table>
  ${shown.length < rows.length ? `<div class="more"><button class="btn sec" data-a="more">عرض المزيد (${rows.length - shown.length})</button></div>` : ''}`;
  hydrateThumbs();
}
async function onEmpClick(e){
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'more'){ empF.limit += 60; return renderEmployees(); }
  const r = empCache.find(x => x.id === b.dataset.id); if (!r) return;
  if (a === 'view') return memberModal(r);
  if (a === 'edit') return employeeModal(r);
  if (a === 'del'){
    if (!await confirmDialog(`سيُحذف «${r.full_name}» نهائياً مع صوره وتقييماته. للاحتفاظ بالسجل غيّر الحالة إلى «غير نشط» بدل الحذف.`, 'حذف نهائي')) return;
    await run(b, async () => {
      for (const [bk, p] of [['photos', r.photo_path], ['ids', r.id_doc_path]]) if (p){ const { error } = await sb.storage.from(bk).remove([p]); if (error) throw error; }
      await db(sb.from('employees').delete().eq('id', r.id));
      toast('تم الحذف'); await loadEmployees();
    });
  }
}

    if (f && /^image\//.test(f.type)){ img.src = URL.createObjectURL(f); img.hidden = false; } else { img.hidden = true; }
  }));

  onSubmit($('#ef', m.el), async f => {
    const bad = msg => { toast(msg, true); return false; };
    const row = {
      membership_no: toLatin(f.get('membership_no')).trim(),
      full_name: String(f.get('full_name')).replace(/\s+/g, ' ').trim(),
      phone: toLatin(f.get('phone')).replace(/[\s\-()]/g, ''),
      national_id: toLatin(f.get('national_id')).replace(/\s/g, ''),
      birth_date: String(f.get('birth_date') || '').trim(),
      governorate: f.get('governorate'),
      address: String(f.get('address')).trim(),
      capacity: f.get('capacity'),
      committee: f.get('committee'),
      gender: f.get('gender'),
      union_governorate: f.get('union_governorate'),
      study_status: f.get('study_status'),
      edu_stage: f.get('edu_stage'),
      institution: String(f.get('institution') || '').replace(/\s+/g, ' ').trim()
    };
    if (!row.membership_no) return bad('رقم العضوية مطلوب');
    if (!/^[\u0621-\u064A\s]+$/.test(row.full_name)) return bad('اكتب الاسم بالعربية فقط (حروف عربية بدون أرقام أو رموز)');
    if (row.full_name.split(' ').length < 3) return bad('اكتب الاسم كاملاً (ثلاثة أسماء على الأقل)');
    if (!/^\+?\d{8,15}$/.test(row.phone)) return bad('رقم الهاتف غير صالح (أرقام فقط)');
    if (!/^\d{14}$/.test(row.national_id)) return bad('رقم البطاقة يجب أن يكون 14 رقماً');
    if (!isDate(row.birth_date)) return bad('تاريخ الميلاد مطلوب');
    if (row.birth_date < '1900-01-01' || row.birth_date > today()) return bad('تاريخ الميلاد غير صالح');
    if (!GOVS.includes(row.governorate)) return bad('اختر المحافظة');
    if (!row.address) return bad('العنوان مطلوب');
    if (!CAPS.includes(row.capacity)) return bad('اختر الصفة');
    if (!COMMITTEES.includes(row.committee)) return bad('اختر اللجنة أو جهة التمثيل');
    if (!GENDERS.includes(row.gender)) return bad('اختر الجنس');
    if (!GOVS.includes(row.union_governorate)) return bad('اختر المحافظة التابع لها بالاتحاد');
    if (!STUDY.includes(row.study_status)) return bad('اختر: طالب أو خريج');
    if (!EDU_STAGES.includes(row.edu_stage)) return bad('اختر المرحلة التعليمية');
    if (!row.institution) return bad('اسم المدرسة / الجامعة مطلوب');
    if (!edit && !f.get('consent')) return bad('يجب تأكيد موافقة العضو أولاً');
    const dup = empCache.find(x => x.id !== e.id && (x.membership_no === row.membership_no || x.national_id === row.national_id));
    if (dup) return bad(dup.membership_no === row.membership_no ? 'رقم العضوية مستخدم مسبقاً' : 'رقم البطاقة مسجَّل مسبقاً');
    if (edit) row.status = f.get('status');
    if (!edit || f.get('consent')) row.consent = true;
    const photo = f.get('photo'), idimg = f.get('idimg'), old = [];
    if (photo && photo.size){ row.photo_path = await uploadImage('photos', photo); if (e.photo_path) old.push(['photos', e.photo_path]); }
    if (idimg && idimg.size){ row.id_doc_path = await uploadImage('ids', idimg); if (e.id_doc_path) old.push(['ids', e.id_doc_path]); }
    try {
      await db(edit ? sb.from('employees').update(row).eq('id', e.id) : sb.from('employees').insert(row));
    } catch (err){
      if (/duplicate/i.test(err.message)) throw new Error(/national_id/i.test(err.message) ? 'رقم البطاقة مسجَّل مسبقاً' : 'رقم العضوية مستخدم مسبقاً');
      throw err;
    }
    for (const [bk, p] of old) sb.storage.from(bk).remove([p]); // يحذف القديم إن كان المستخدم مسؤولاً
    m.close(); toast(edit ? 'تم تحديث البيانات' : 'تم الحفظ'); loadEmployees();
  });
}

/* ================= المهام ================= */
let taskCache = [], taskF = 'all';
function taskState(t){
  if (t.status === 'delivered'){
    const late = t.due_date && t.delivered_at && ymd(t.delivered_at) > t.due_date;
    return late ? { k: 'late-d', l: 'سُلّمت متأخرة', c: 'warn' } : { k: 'ontime', l: 'سُلّمت في الوقت', c: 'ok' };
  }
  if (t.due_date && t.due_date < today()) return { k: 'overdue', l: 'متأخرة', c: 'bad' };
  return { k: 'pending', l: 'قيد التنفيذ', c: 'info' };
}
function dueText(t){
  if (!t.due_date) return 'بلا موعد محدد';
  if (t.status === 'delivered') return 'الموعد ' + t.due_date;
  const d = daysTo(t.due_date);
  return d < 0 ? `متأخرة منذ ${daysAr(-d)}` : d === 0 ? 'التسليم اليوم' : d === 1 ? 'التسليم غداً' : `بعد ${daysAr(d)} (${t.due_date})`;
}
async function viewTasks(tok){
  taskF = 'all';
  paint(tok, `
  <div class="toolbar">
    <div class="chips" id="tfc">${[['all', 'الكل'], ['pending', 'قيد التنفيذ'], ['overdue', 'متأخرة'], ['delivered', 'مسلّمة']].map(([v, l], i) => `<button data-v="${v}" class="${i ? '' : 'on'}">${l}</button>`).join('')}</div>
    <span class="muted" id="tcnt"></span>
    ${isAdmin() ? `<button class="btn end" id="addT">${ic('plus')} مهمة جديدة</button>` : ''}
  </div>
  <div id="tl" class="tasks" data-nr>${'<div class="sk" style="height:96px"></div>'.repeat(3)}</div>`);
  $('#tfc').onclick = e => { const b = e.target.closest('button'); if (!b) return; taskF = b.dataset.v; $$('#tfc button').forEach(x => x.classList.toggle('on', x === b)); renderTasks(); };
  if (isAdmin()) $('#addT').onclick = () => taskModal(null);
  $('#tl').addEventListener('click', onTaskClick);
  await loadTasks();

async function loadTasks(){
  taskCache = await db(sb.from('tasks').select('*').order('created_at', { ascending: false }));
  renderTasks();
}
function renderTasks(){
  const el = $('#tl'); if (!el) return;
  const rows = taskCache.map(t => ({ t, s: taskState(t) })).filter(({ t, s }) => taskF === 'all' || (taskF === 'pending' && s.k === 'pending') || (taskF === 'overdue' && s.k === 'overdue') || (taskF === 'delivered' && t.status === 'delivered'));
  const c = $('#tcnt'); if (c) c.textContent = rows.length + ' مهمة';
  if (!rows.length){ el.innerHTML = emptyBox('tasks', taskCache.length ? 'لا توجد مهام في هذا التصنيف.' : (isAdmin() ? 'لا توجد مهام بعد. أضف أول مهمة.' : 'لا توجد مهام مسندة إليك.')); return; }
  el.innerHTML = rows.map(({ t, s }, i) => {
    const link = safeUrl(t.delivery_link);
    return `<article class="task ${s.c} rise" style="--i:${Math.min(i, 10)}">
      <div class="t-main"><h4>${esc(t.title)}</h4>${t.description ? `<p>${esc(t.description)}</p>` : ''}
        <div class="meta">${isAdmin() ? `<span>${ic('user', 15)} ${esc(nameOf(t.assigned_to))}</span>` : ''}<span>${ic('clock', 15)} ${esc(dueText(t))}</span><span class="tag ${s.c}">${s.l}</span></div>
        ${t.status === 'delivered' ? `<div class="deliv">${ic('check', 16)}<span>سُلّمت ${esc(ymd(t.delivered_at))}</span>${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${ic('link', 15)} فتح الرابط</a>` : ''}${t.delivery_note ? `<span class="muted">${esc(t.delivery_note)}</span>` : ''}</div>` : ''}
      </div>
      <div class="t-act">
        ${t.status === 'pending' && t.assigned_to === me.id ? `<button class="btn sm" data-a="deliver" data-id="${t.id}">${ic('check', 16)} تسليم</button>` : ''}
        ${isAdmin() && t.status === 'delivered' ? `<button class="btn sec sm" data-a="reopen" data-id="${t.id}" title="إعادة فتح المهمة">${ic('undo', 15)} إعادة فتح</button>` : ''}
        ${isAdmin() ? `<button class="btn ghost sm icon" data-a="edit" data-id="${t.id}" title="تعديل" aria-label="تعديل">${ic('edit')}</button><button class="btn danger sm icon" data-a="del" data-id="${t.id}" title="حذف" aria-label="حذف">${ic('trash')}</button>` : ''}
      </div></article>`;
  }).join('');
}
async function onTaskClick(e){
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const t = taskCache.find(x => x.id === b.dataset.id); if (!t) return;
  const a = b.dataset.a;
  if (a === 'edit') return taskModal(t);
  if (a === 'deliver') return deliverModal(t);
  if (a === 'del'){
    if (!await confirmDialog(`حذف المهمة «${t.title}»؟`, 'حذف')) return;
    return run(b, async () => { await db(sb.from('tasks').delete().eq('id', t.id)); toast('تم الحذف'); await loadTasks(); });
  }
  if (a === 'reopen'){
    if (!await confirmDialog('إعادة المهمة إلى «قيد التنفيذ» وحذف بيانات تسليمها؟', 'إعادة فتح', false)) return;
    return run(b, async () => { await db(sb.from('tasks').update({ status: 'pending', delivered_at: null, delivery_link: null, delivery_note: null }).eq('id', t.id)); toast('أُعيد فتح المهمة'); await loadTasks(); });
  }
}
function taskModal(t){

function deliverModal(t){
  const m = openModal('تسليم: ' + t.title, `
  <form id="df">
    <div class="fld"><label>رابط الملف المسلَّم (اختياري)</label><input name="link" type="url" dir="ltr" placeholder="https://" maxlength="500"></div>

/* ================= التفاعل الأسبوعي ================= */
const SAT_OPTS = [[1, '😞', 'ضعيف'], [2, '🙁', 'دون المتوسط'], [3, '😐', 'متوسط'], [4, '🙂', 'جيد'], [5, '😄', 'ممتاز']];
const WORK_OPTS = [[1, '1', 'خفيف'], [2, '2', 'مقبول'], [3, '3', 'متوسط'], [4, '4', 'ثقيل'], [5, '5', 'مرهق']];
const RATE_OPTS = [[1, '1', 'ضعيف'], [2, '2', 'مقبول'], [3, '3', 'جيد'], [4, '4', 'جيد جداً'], [5, '5', 'ممتاز']];
const pick = (name, items, val) => `<div class="pick" role="radiogroup">${items.map(([v, l, s]) => `<label><input type="radio" name="${name}" value="${v}"${String(val) === String(v) ? ' checked' : ''} required><span><b>${l}</b><small>${s}</small></span></label>`).join('')}</div>`;

function weeklyChart(rows){
  const g = {};
  rows.forEach(r => { const o = g[r.week_start] = g[r.week_start] || { s: [], w: [] }; o.s.push(r.satisfaction); o.w.push(r.workload); });
  const keys = Object.keys(g).sort().slice(-8);
  if (!keys.length) return emptyBox('heart', 'لا توجد بيانات كافية للرسم بعد.');
  const av = a => a.reduce((x, y) => x + y, 0) / a.length;
  return `<div class="wchart" role="img" aria-label="متوسط الرضا وحجم العمل لكل أسبوع">${keys.map((k, i) => {
    const s = av(g[k].s), w = av(g[k].w);
    return `<div class="wg"><div class="bars"><div class="bar b1" style="--h:${(s / 5 * 100).toFixed(0)}%;--d:${i * 70}ms" title="الرضا ${s.toFixed(1)}"><em>${s.toFixed(1)}</em></div><div class="bar b2" style="--h:${(w / 5 * 100).toFixed(0)}%;--d:${i * 70 + 35}ms" title="حجم العمل ${w.toFixed(1)}"><em>${w.toFixed(1)}</em></div></div><small class="muted">${esc(k.slice(5))}</small></div>`;
  }).join('')}</div><div class="legend"><span><i class="b1"></i>الرضا</span><span><i class="b2"></i>حجم العمل</span></div>`;
}

/* ================= لوحة التحكم (مسؤول) ================= */
function donut(parts, aria = 'توزيع حالات المهام', unit = 'مهمة'){
  const total = parts.reduce((s, p) => s + p.v, 0), R = 52, C = 2 * Math.PI * R;
  let off = 0;
  const segs = parts.filter(p => p.v > 0).map(p => { const len = p.v / total * C; const s = `<circle class="seg" cx="70" cy="70" r="${R}" style="stroke:${p.c}" data-len="${len.toFixed(2)}" stroke-dasharray="0 1000" stroke-dashoffset="${(-off).toFixed(2)}"></circle>`; off += len; return s; }).join('');
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${esc(aria)}"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/><g transform="rotate(-90 70 70)">${segs}</g><text x="70" y="70" text-anchor="middle" class="d-n">${total}</text><text x="70" y="88" text-anchor="middle" class="d-l">${esc(unit)}</text></svg>`;
}
const kpi = (icon, label, val, o = {}) => `<div class="kpi ${o.tone || ''}"><span class="k-ic">${ic(icon, 22)}</span><div><span class="muted">${label}</span>${val == null ? '<b>—</b>' : `<b data-count="${val}" data-dec="${o.dec || 0}" data-suf="${o.suf || ''}">0${o.suf || ''}</b>`}</div></div>`;

/* ---------- مكوّنات تحليل الأعضاء ---------- */
const AGE_GROUPS = [['أقل من 18', 0, 17], ['من 18 إلى 21', 18, 21], ['من 22 إلى 25', 22, 25], ['من 26 إلى 30', 26, 30], ['من 31 إلى 40', 31, 40], ['أكثر من 40', 41, 200]];
const COMPLETE_FIELDS = [['رقم العضوية', 'membership_no'], ['رقم الهاتف', 'phone'], ['رقم البطاقة', 'national_id'], ['تاريخ الميلاد', 'birth_date'], ['الجنس', 'gender'],
  ['محافظة السكن', 'governorate'], ['المحافظة التابع لها بالاتحاد', 'union_governorate'], ['العنوان', 'address'], ['الصفة', 'capacity'], ['اللجنة / جهة التمثيل', 'committee'],
  ['طالب / خريج', 'study_status'], ['المرحلة التعليمية', 'edu_stage'], ['اسم المدرسة / الجامعة', 'institution'], ['الصورة الشخصية', 'photo_path'], ['صورة الهوية', 'id_doc_path']];

/* أشرطة أفقية: items = [{l, v}] */
function hbars(items, total){
  if (!items.length) return emptyBox('layout', 'لا توجد بيانات بعد.');
  const max = Math.max(1, ...items.map(x => x.v));
  return `<div class="hb">${items.map(x => `<div class="hb-r"><span class="hb-l" title="${esc(x.l)}">${esc(x.l)}</span><div class="hb-t"><i style="--w:${(x.v / max * 100).toFixed(1)}%"></i></div><b class="hb-v">${x.v}<small class="muted"> ${total ? Math.round(x.v / total * 100) : 0}%</small></b></div>`).join('')}</div>`;
}
/* أعمدة رأسية: items = [{l, v}] */
function colChart(items, aria){
  const max = Math.max(1, ...items.map(x => x.v));
  return `<div class="wchart" role="img" aria-label="${esc(aria)}">${items.map((x, i) => `<div class="wg"><div class="bars"><div class="bar b1" style="--h:${(x.v / max * 100).toFixed(0)}%;--d:${i * 50}ms" title="${esc(x.l)}: ${x.v}"><em>${x.v}</em></div></div><small class="muted">${esc(x.l)}</small></div>`).join('')}</div>`;
}
/* جدول تفصيل: الإجمالي + ذكور/إناث + طلاب/خريجون لكل قيمة في list */
function breakTable(rows, list, field, firstLabel, opt = {}){
  const z = v => v ? v : '<span class="muted">0</span>';
  const cnt = (m, f, v) => m.filter(r => r[f] === v).length;
  let groups = list.map(k => ({ k, m: rows.filter(r => r[field] === k) }));
  groups.sort((a, b) => b.m.length - a.m.length);
  if (opt.hideZero) groups = groups.filter(x => x.m.length);
  const unk = rows.filter(r => !r[field]);
  if (unk.length) groups.push({ k: 'غير محدد', m: unk });
  if (!groups.length) return emptyBox('layout', 'لا توجد بيانات بعد.');
  const max = Math.max(1, ...groups.map(x => x.m.length));
  const tot = f => v => rows.filter(r => r[f] === v).length;
  return `<div class="tbl${opt.scroll ? ' sc' : ''}"><table><thead><tr><th>${firstLabel}</th><th>الإجمالي</th><th>ذكور</th><th>إناث</th><th>طلاب</th><th>خريجون</th></tr></thead><tbody>
  ${groups.map((x, i) => `<tr style="--i:${Math.min(i, 12)}"><td><b>${esc(x.k)}</b></td>
    <td><div class="pr"><div class="hb-t" style="flex:1;min-width:60px"><i style="--w:${(x.m.length / max * 100).toFixed(1)}%"></i></div><b>${x.m.length}</b></div></td>
    <td>${z(cnt(x.m, 'gender', 'ذكر'))}</td><td>${z(cnt(x.m, 'gender', 'أنثى'))}</td><td>${z(cnt(x.m, 'study_status', 'طالب'))}</td><td>${z(cnt(x.m, 'study_status', 'خريج'))}</td></tr>`).join('')}
  </tbody><tfoot><tr><th>الإجمالي</th><th>${rows.length}</th><th>${tot('gender')('ذكر')}</th><th>${tot('gender')('أنثى')}</th><th>${tot('study_status')('طالب')}</th><th>${tot('study_status')('خريج')}</th></tr></tfoot></table></div>`;
}
/* كل تحليلات الأعضاء في قطعة HTML واحدة (تُعاد رسمها عند تبديل «النشطون فقط») */
function memberAnalytics(rows){
  const n = rows.length;
  if (!n) return `<div class="card">${emptyBox('users', 'لا توجد بيانات أعضاء لتحليلها بعد.')}</div>`;
  const pct = x => Math.round(x / n * 100);
  const c = (f, v) => rows.filter(r => r[f] === v).length;
  const male = c('gender', 'ذكر'), female = c('gender', 'أنثى'), stud = c('study_status', 'طالب'), grad = c('study_status', 'خريج');
  const active = c('status', 'active');
  const ages = rows.map(r => ageOf(r.birth_date)).filter(a => a != null);
  const avgAge = ages.length ? ages.reduce((s, a) => s + a, 0) / ages.length : null;
  const since = Date.now() - 30 * 864e5;
  const fresh = rows.filter(r => Date.parse(r.created_at) >= since).length;
  const incompleteN = rows.filter(r => incomplete(r)).length;
  const commN = new Set(rows.map(r => r.committee).filter(Boolean)).size;

  const dCard = (title, parts, aria) => {
    parts = parts.filter(p => p.keep || p.v > 0);
    return `<div class="card"><h2>${title}</h2><div class="donut-wrap">${donut(parts, aria, 'عضو')}<ul class="leg">${parts.map(p => `<li><i style="background:${p.c}"></i>${p.l}<b>${p.v} <span class="muted">(${pct(p.v)}%)</span></b></li>`).join('')}</ul></div></div>`;
  };

  // الفئات العمرية
  const ageItems = AGE_GROUPS.map(([l, a, b]) => ({ l, v: ages.filter(x => x >= a && x <= b).length }));
  if (n - ages.length > 0) ageItems.push({ l: 'غير محدد', v: n - ages.length });

  // التسجيل الشهري (آخر 12 شهراً)
  const now = new Date(), months = [];
  for (let i = 11; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); }
  const byM = {}; rows.forEach(r => { const k = ymd(r.created_at).slice(0, 7); byM[k] = (byM[k] || 0) + 1; });

  // محافظات السكن
  const govItems = GOVS.map(g => ({ l: g, v: c('governorate', g) })).filter(x => x.v).sort((a, b) => b.v - a.v);
  const govUnk = rows.filter(r => !r.governorate).length; if (govUnk) govItems.push({ l: 'غير محدد', v: govUnk });

  // أكثر الجهات التعليمية
  const inst = {};
  rows.forEach(r => { if (!r.institution) return; const k = norm(r.institution); (inst[k] = inst[k] || { l: String(r.institution).trim(), v: 0 }).v++; });
  const instItems = Object.values(inst).sort((a, b) => b.v - a.v).slice(0, 10);

  // اكتمال البيانات
  const compl = COMPLETE_FIELDS.map(([l, f]) => { const p = pct(rows.filter(r => r[f]).length); return `<div class="hb-r"><span class="hb-l" title="${esc(l)}">${esc(l)}</span><div class="hb-t"><i class="${p >= 90 ? 'ok' : p >= 60 ? 'warn' : 'bad'}" style="--w:${p}%"></i></div><b class="hb-v">${p}%</b></div>`; }).join('');

  return `
  <div class="kpis">
    ${kpi('users', 'إجمالي الأعضاء', n)}
    ${kpi('check', 'النشطون', active, { tone: 'ok' })}
    ${kpi('user', 'الذكور', male)}
    ${kpi('user', 'الإناث', female)}
    ${kpi('grad', 'الطلاب', stud)}
    ${kpi('grad', 'الخريجون', grad, { tone: 'ok' })}
    ${kpi('cal', 'متوسط العمر (سنة)', avgAge, { dec: 1 })}
    ${kpi('briefcase', 'لجان / جهات فيها أعضاء', commN)}
    ${kpi('plus', 'أعضاء جدد (آخر 30 يوماً)', fresh)}
    ${kpi('alert', 'سجلات ببيانات ناقصة', incompleteN, { tone: incompleteN ? 'warn' : 'ok' })}
  </div>
  <div class="cols">
    ${dCard('الجنس', [{ v: male, c: 'var(--pri)', l: 'ذكور', keep: 1 }, { v: female, c: '#d6409f', l: 'إناث', keep: 1 }, { v: n - male - female, c: 'var(--mut)', l: 'غير محدد' }], 'توزيع الأعضاء حسب الجنس')}
    ${dCard('طالب / خريج', [{ v: stud, c: 'var(--ok)', l: 'طلاب', keep: 1 }, { v: grad, c: 'var(--warn)', l: 'خريجون', keep: 1 }, { v: n - stud - grad, c: 'var(--mut)', l: 'غير محدد' }], 'توزيع الأعضاء بين طلاب وخريجين')}
    ${dCard('حالة العضوية', [{ v: active, c: 'var(--ok)', l: 'نشط', keep: 1 }, { v: n - active, c: 'var(--mut)', l: 'غير نشط', keep: 1 }], 'توزيع الأعضاء حسب الحالة')}
  </div>
  <div class="card"><h2>الأعضاء حسب اللجنة / جهة التمثيل</h2>${breakTable(rows, COMMITTEES, 'committee', 'اللجنة / جهة التمثيل')}</div>
  <div class="cols">
    <div class="card"><h2>الأعضاء حسب الصفة</h2>${breakTable(rows, CAPS, 'capacity', 'الصفة')}</div>
    <div class="card"><h2>الأعضاء حسب المرحلة التعليمية</h2>${breakTable(rows, EDU_STAGES, 'edu_stage', 'المرحلة')}</div>
  </div>
  <div class="cols">
    <div class="card"><h2>المحافظة التابع لها بالاتحاد</h2>${breakTable(rows, GOVS, 'union_governorate', 'المحافظة', { hideZero: true, scroll: true })}</div>
    <div class="card"><h2>محافظة السكن</h2><div class="sc">${hbars(govItems, n)}</div></div>
  </div>
  <div class="cols">
    <div class="card"><h2>الفئات العمرية</h2>${hbars(ageItems, n)}</div>
    <div class="card"><h2>التسجيل الشهري <span class="muted">آخر 12 شهراً</span></h2>${colChart(months.map(k => ({ l: k.slice(2), v: byM[k] || 0 })), 'عدد الأعضاء المسجَّلين في كل شهر')}</div>
  </div>
  <div class="cols">
    <div class="card"><h2>أكثر الجهات التعليمية <span class="muted">أعلى 10</span></h2>${hbars(instItems, n)}</div>
    <div class="card"><h2>اكتمال البيانات <span class="muted">نسبة الأعضاء المسجَّل لهم كل حقل</span></h2><div class="hb">${compl}</div></div>
  </div>`;
}

  $('#xAll').onclick = e => run(e.currentTarget, async () => exportXlsx(`hr_all_data_${stamp}.xlsx`, [empSheet(emps), taskSheet(tasks), perfSheet(perf, en), engSheet(eng), logSheet(await fetchLogs(), en)], null));
}

init();
</script>
</body>
